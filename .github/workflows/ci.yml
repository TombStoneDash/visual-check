name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      # Keep dependency installation deterministic; browser provisioning is
      # explicit and cacheable because the capture contract runs real Chromium.
      - name: Install deps (no browser download)
        run: npm ci --ignore-scripts
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium (with system deps)
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  # F2: the gate action (action.yml) against a fixture consumer. Baselines are
  # captured in this job so they match the runner's fonts; the gate must be
  # green on the unchanged page and red after a one-word edit.
  gate-action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Serve fixture site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory examples/consumer/site &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 0.5; done
      - name: Capture baselines (refresh mode)
        uses: ./
        with:
          config: examples/consumer/visual-check.config.mjs
          baseline-dir: ${{ runner.temp }}/fixture-baselines
          mode: refresh
      - name: Gate on unchanged page (must pass)
        id: same
        uses: ./
        with:
          config: examples/consumer/visual-check.config.mjs
          baseline-dir: ${{ runner.temp }}/fixture-baselines
          threshold-pct: "0.1"
      - name: One-word edit
        run: sed -i 's/Fixture consumer home/Fixture consumer XXXX/' examples/consumer/site/index.html
      - name: Gate on edited page (must fail)
        id: edited
        continue-on-error: true
        uses: ./
        with:
          config: examples/consumer/visual-check.config.mjs
          baseline-dir: ${{ runner.temp }}/fixture-baselines
          threshold-pct: "0.1"
      - name: Check verdicts
        run: |
          echo "unchanged: ${{ steps.same.outputs.terminal-state }} exit ${{ steps.same.outputs.exit-code }}"
          echo "edited:    ${{ steps.edited.outputs.terminal-state }} exit ${{ steps.edited.outputs.exit-code }} outcome ${{ steps.edited.outcome }}"
          test "${{ steps.same.outputs.exit-code }}" = 0
          test "${{ steps.edited.outcome }}" = failure
          test "${{ steps.edited.outputs.exit-code }}" = 1
